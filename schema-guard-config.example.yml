# schema-guard-config.yml — Configuration file for Schema Guard
# Place this file in your project root. Schema Guard will auto-detect it.
#
# All values can use Jinja2 templating with env_var():
#   {{ env_var('MY_VAR') }}              — required env var
#   {{ env_var('MY_VAR', 'default') }}   — with fallback

# -------------------------------------------------------------------
# Global defaults (used when no profile is active)
# -------------------------------------------------------------------
contract: contracts/orders.yaml
snapshot-file: snapshots/orders.json
verbose: false
dry-run: false
require-alert: false

# -------------------------------------------------------------------
# Email alerting settings (overrides .env EMAIL_* variables)
# -------------------------------------------------------------------
# email:
#   enabled: true
#   host: smtp.gmail.com
#   port: 587
#   user: "{{ env_var('EMAIL_USER') }}"
#   password: "{{ env_var('EMAIL_PASSWORD') }}"
#   from: alerts@example.com
#   to: oncall@example.com
#   subject: "Schema Drift Detected"

